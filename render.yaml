services:
  - type: web
    name: bloodmoon
    runtime: node
    plan: free

    buildCommand: npm ci
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: NODE_VERSION
        value: 22

      - key: MONGO_DB
        value: bloodmoon

      - key: MONGO_URI
        sync: false
