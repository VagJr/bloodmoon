services:
  - type: web
    name: bloodmoon
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_DB
        value: bloodmoon
      - key: MONGO_URI
        sync: false
